<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Olympus X1000</title>
    <style>
        :root { --gold: #ffcc00; --bg: #0f0f0f; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; padding: 10px; }
        .page { display: none; max-width: 450px; margin: auto; }
        .active { display: block; }
        .box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #333; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .reel-box { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
        .reel { width: 85px; height: 110px; background: linear-gradient(145deg, #fff, #ddd); color: #222; font-size: 3.5em; line-height: 110px; border-radius: 10px; border: 3px solid var(--gold); font-weight: bold; }
        .spinning { animation: blur 0.1s infinite; }
        @keyframes blur { 50% { filter: blur(5px); transform: translateY(3px); } }
        input, select { width: 90%; padding: 12px; margin: 5px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 95%; padding: 15px; background: linear-gradient(to bottom, #ffcc00, #ff9900); border: none; font-weight: bold; cursor: pointer; border-radius: 10px; font-size: 1.1em; color: #000; margin: 5px 0; }
        .btn-claim { background: #2ecc71; color: white; margin-top: 10px; }
        .status-win { color: var(--gold); font-size: 1.5em; font-weight: bold; text-shadow: 0 0 10px gold; }
        table { width: 100%; font-size: 0.75em; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="page-login" class="page active">
        <div class="box">
            <h1 style="color: var(--gold); margin-bottom: 0;">MAHJONG WAYS</h1>
            <p style="margin-top: 0; color: #888;">Olympus X1000 Local Server</p>
            <input type="text" id="u-in" placeholder="Username">
            <input type="password" id="p-in" placeholder="Password (Admin: admin123)">
            <button onclick="login()">MASUK GAME</button>
        </div>
    </div>

    <!-- USER PAGE -->
    <div id="page-user" class="page">
        <div style="display:flex; justify-content: space-between; align-items: center; padding: 5px;">
            <span>USER: <b id="u-tag" style="color:var(--gold)"></b></span>
            <small onclick="logout()" style="color:red; cursor:pointer;">Keluar</small>
        </div>

        <div class="box">
            <h2 id="bal-txt" style="font-size: 2.2em; margin: 10px 0; color:#2ecc71;">Rp 0</h2>
            <label style="font-size: 0.8em; color: #aaa;">Pilih Nominal Taruhan:</label>
            <select id="bet-select">
                <option value="200">Rp 200</option>
                <option value="500" selected>Rp 500</option>
                <option value="1000">Rp 1.000</option>
                <option value="5000">Rp 5.000</option>
                <option value="10000">Rp 10.000</option>
            </select>

            <div class="reel-box">
                <div id="r1" class="reel">🀄</div>
                <div id="r2" class="reel">🀄</div>
                <div id="r3" class="reel">🀄</div>
            </div>

            <button id="spinBtn" onclick="spin()">PUTAR (SPIN)</button>
            <div id="msg" style="height: 40px; margin-top: 15px;"></div>
        </div>

        <!-- PANEL VOUCHER -->
        <div class="box">
            <h3 style="margin: 0; color: var(--gold);">Klaim Voucher</h3>
            <input type="text" id="v-code" placeholder="Masukkan Kode Voucher">
            <button class="btn-claim" onclick="claimVoucher()">KLAIM</button>
        </div>
    </div>

    <!-- ADMIN PAGE -->
    <div id="page-admin" class="page">
        <div style="display:flex; justify-content: space-between; align-items: center; padding: 5px;">
            <span>PANEL ADMIN</span>
            <small onclick="logout()" style="color:red; cursor:pointer;">Keluar</small>
        </div>
        <div class="box">
    <h3>Pengaturan Mode</h3>
    <label>Pilih Mode Game:</label>
    <select id="rtp-input">
        <option value="0.5">Normal (RTP 50%)</option>
        <option value="0.0">Rungkad (RTP 0%)</option>
        <option value="1.0">Jackpot (RTP 100%)</option>
    </select>
    <button onclick="saveRTP()">Simpan Mode</button>
</div>
        <div class="box">
            <h3>Buat Voucher</h3>
            <input type="number" id="v-amount" placeholder="Nominal Saldo">
            <button onclick="generateVoucher()">Buat Kode</button>
            <p id="v-result" style="color: var(--gold); font-weight: bold;"></p>
        </div>
    </div>

<script>
// Database Virtual berbasis LocalStorage
let currentUser = "";
const symbols = ["🀄", "🍭", "💎", "🔔", "🍒"];

function login() {
    const user = document.getElementById('u-in').value.trim();
    const pass = document.getElementById('p-in').value;

    if (!user) return alert("Username tidak boleh kosong");

    if (user === "admin" && pass === "admin123") {
        showPage('page-admin');
    } else {
        currentUser = user;
        document.getElementById('u-tag').innerText = user.toUpperCase();
        
        // Inisialisasi saldo virtual jika user baru
        if (!localStorage.getItem(`bal_${user}`)) {
            localStorage.setItem(`bal_${user}`, 10000);
        }
        updateBalanceView();
        showPage('page-user');
    }
}

function logout() {
    currentUser = "";
    showPage('page-login');
}

function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

function updateBalanceView() {
    let bal = localStorage.getItem(`bal_${currentUser}`) || 0;
    document.getElementById('bal-txt').innerText = "Rp " + parseInt(bal).toLocaleString('id-ID');
}

function spin() {
    let bet = parseInt(document.getElementById('bet-select').value);
    let bal = parseInt(localStorage.getItem(`bal_${currentUser}`));
    let rtp = parseFloat(localStorage.getItem('game_rtp') || 0.5);

    if (bal < bet) return alert("Saldo tidak cukup!");

    bal -= bet;
    localStorage.setItem(`bal_${`bal_${currentUser}`}`, bal);
    
    // Efek putar otomatis visual
    document.getElementById('r1').classList.add('spinning');
    document.getElementById('r2').classList.add('spinning');
    document.getElementById('r3').classList.add('spinning');
    document.getElementById('msg').innerHTML = "Memutar...";

    setTimeout(() => {
        document.getElementById('r1').classList.remove('spinning');
        document.getElementById('r2').classList.remove('spinning');
        document.getElementById('r3').classList.remove('spinning');

        let isWin = Math.random() < rtp;
        let res1, res2, res3;

        if (isWin) {
            let sym = symbols[Math.floor(Math.random() * symbols.length)];
            res1 = res2 = res3 = sym;
            let winAmt = bet * 5; 
            bal += winAmt;
            document.getElementById('msg').innerHTML = `<span class="status-win">MENANG Rp ${winAmt.toLocaleString('id-ID')}!</span>`;
        } else {
            res1 = symbols[Math.floor(Math.random() * symbols.length)];
            res2 = symbols[Math.floor(Math.random() * symbols.length)];
            res3 = symbols[Math.floor(Math.random() * symbols.length)];
            if(res1 === res2 && res2 === res3) res3 = symbols[(symbols.indexOf(res3)+1)%symbols.length]; // Paksa kalah
            document.getElementById('msg').innerHTML = "<span style='color:#ff4d4d'>Coba Lagi!</span>";
        }

        document.getElementById('r1').innerText = res1;
        document.getElementById('r2').innerText = res2;
        document.getElementById('r3').innerText = res3;

        localStorage.setItem(`bal_${currentUser}`, bal);
        updateBalanceView();
    }, 1000);
}

function saveRTP() {
    let rtp = document.getElementById('rtp-input').value;
    localStorage.setItem('game_rtp', rtp);
    alert("RTP diperbarui ke: " + rtp);
}

function generateVoucher() {
    let amt = document.getElementById('v-amount').value;
    if(!amt) return alert("Masukkan nominal");
    let code = "VC-" + Math.random().toString(36).substr(2, 6).toUpperCase();
    
    localStorage.setItem(`voucher_${code}`, amt);
    document.getElementById('v-result').innerText = `Kode: ${code} (Rp ${parseInt(amt).toLocaleString('id-ID')})`;
}

function claimVoucher() {
    let code = document.getElementById('v-code').value.trim();
    let amt = localStorage.getItem(`voucher_${code}`);

    if (amt) {
        let bal = parseInt(localStorage.getItem(`bal_${currentUser}`)) || 0;
        bal += parseInt(amt);
        localStorage.setItem(`bal_${currentUser}`, bal);
        localStorage.removeItem(`voucher_${code}`); // Hapus kode setelah diklaim
        updateBalanceView();
        alert(`Berhasil klaim voucher sebesar Rp ${parseInt(amt).toLocaleString('id-ID')}`);
        document.getElementById('v-code').value = "";
    } else {
        alert("Kode tidak valid atau sudah digunakan!");
    }
}
</script>
</body>
</html>
